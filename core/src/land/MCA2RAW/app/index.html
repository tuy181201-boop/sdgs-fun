<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MCA2RAW Protocol</title>
    <style>
        :root { --bg: #1e1e1e; --panel: #252526; --text: #cccccc; --accent: #007acc; --green: #4caf50; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }
        input { width: 100%; padding: 10px; background: var(--panel); border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .progress-container { width: 100%; background: #333; border-radius: 4px; margin: 15px 0; height: 25px; display: none; }
        .progress-bar { height: 100%; background: var(--green); border-radius: 4px; width: 0%; text-align: center; line-height: 25px; color: white; font-weight: bold; transition: width 0.2s; }
        pre { background: #000; padding: 15px; border-radius: 4px; color: var(--green); overflow: auto; flex-grow: 1; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>MCA to RAW Converter</h2>
    <div class="row">
        <div class="col"><label>Папка region:</label><input type="text" id="regionPath" placeholder="...saves\Мир\region"></div>
        <div class="col"><label>Сид (папка сохранения):</label><input type="text" id="seed" placeholder="12345"></div>
    </div>
    <div class="row">
        <div class="col"><label>Куда сохранять (SDGS data):</label><input type="text" id="outputPath" value="D:\SDGS\data"></div>
    </div>
    <button id="startBtn" onclick="start()">🚀 НАЧАТЬ КОНВЕРТАЦИЮ</button>
    <div class="progress-container" id="progContainer"><div class="progress-bar" id="progBar">0%</div></div>
    <pre id="console">Готов к работе...</pre>
    <script>
        function logToConsole(t) { const c = document.getElementById('console'); c.innerHTML += "\n" + t; c.scrollTop = c.scrollHeight; }
        function updateProgress(pct) { document.getElementById('progContainer').style.display = 'block'; const b = document.getElementById('progBar'); b.style.width = pct + '%'; b.innerText = pct + '%'; }
        function renderTable(lines) { logToConsole("\n--- СТАТИСТИКА РЕГИОНОВ ---"); lines.forEach(l => logToConsole(l)); logToConsole("---------------------------\n"); }
        async function start() {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('console').innerHTML = "Ожидание...";
            await window.pywebview.api.start_export(document.getElementById('regionPath').value, document.getElementById('outputPath').value, document.getElementById('seed').value);
        }
    </script>
</body>
</html>
