<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIM Player — проигрыватель анимаций</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <aside class="sidebar">
        <h1>🎬 ANIM Player</h1>
        <p class="sub">Воксельные анимации .anim</p>

        <label class="file-btn">
            📂 Открыть .anim
            <input type="file" id="file-input" accept=".anim,.anps">
        </label>

        <label>Кадр: <span id="frame-label">0 / 0</span></label>
        <input type="range" id="frame-slider" min="0" max="0" value="0">

        <label>Скорость: <span id="speed-label">1.0×</span></label>
        <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1">

        <div class="actions">
            <button id="btn-play" class="primary">▶ Играть</button>
            <button id="btn-stop">⏹ Стоп</button>
        </div>

        <div class="info">
            <p><strong>Кадров:</strong> <span id="total-frames">0</span></p>
            <p><strong>FPS:</strong> <span id="fps">30</span></p>
            <p><strong>Размер:</strong> <span id="dims">—</span></p>
        </div>
    </aside>

    <main id="viewport"></main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
